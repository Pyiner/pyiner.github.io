<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>WFD FM 支持</title>
    <style>
      :root { color-scheme: light; --paper: #f8f4e9; --ink: #1d1b18; --muted: #6e695f; --rule: #d8d1c3; --accent: #96362d; }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--paper); color: var(--ink); font: 17px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      main { width: min(680px, calc(100% - 40px)); margin: 0 auto; padding: 72px 0; }
      .kicker { color: var(--accent); font-size: 13px; font-weight: 700; letter-spacing: .18em; }
      h1 { margin: 10px 0 24px; font: 700 clamp(40px, 9vw, 64px)/1.05 Georgia, serif; }
      h2 { margin: 36px 0 8px; font: 700 25px/1.25 Georgia, serif; }
      p { margin: 8px 0; }
      ul { padding-left: 1.2em; }
      a { color: var(--accent); text-underline-offset: 3px; }
      footer { margin-top: 52px; padding-top: 20px; border-top: 1px solid var(--rule); color: var(--muted); font-size: 14px; }
    </style>
  </head>
  <body>
    <main>
      <div class="kicker">WFD FM · SUPPORT</div>
      <h1>使用帮助</h1>
      <p>WFD FM 是一款离线英语听写与跟听应用。题库、原声和豆包语音均随 App 内置，无需联网即可使用。</p>

      <h2>常见问题</h2>
      <ul>
        <li>没有声音：请确认设备音量已打开，并检查是否连接了蓝牙耳机或扬声器。</li>
        <li>学习记录或收藏：这些数据仅保存在当前设备上；删除 App 会同时删除本地记录。</li>
        <li>隐藏文本：听写页与 FM 页都可通过眼睛图标隐藏或显示英文和中文。</li>
      </ul>

      <h2>联系开发者</h2>
      <p>如遇问题，请前往 <a href="https://github.com/Pyiner">GitHub 开发者主页</a> 联系，并附上设备型号、iOS 版本和问题描述。</p>
      <p><a href="../privacy/">查看隐私政策</a></p>

      <footer>最后更新：2026 年 7 月 16 日</footer>
    </main>
  </body>
</html>
